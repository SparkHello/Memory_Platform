[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-model-gateway"
version = "0.5.1"
description = "Local transparent OpenAI-compatible model connection and routing gateway."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "model-gateway-contracts==0.5.1",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.7.0,<3",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "setuptools>=69",
]

[project.scripts]
modelgw = "model_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["model_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
