[providers.zhipu]
name = "Zhipu"
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key_env = "ZHIPU_API_KEY"
enabled = true
timeout_seconds = 60

[providers.deepseek]
name = "DeepSeek"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
enabled = true
timeout_seconds = 60

[[provider_models]]
id = "zhipu-glm-5-1"
