<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">How one conversation becomes long-term memory</title>
  <desc id="desc">Chat normally, verify and save durable information, recall it when relevant, and keep it under the user's control.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151217"/>
      <stop offset="1" stop-color="#241c1a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#c79a5a"/>
    </marker>
  </defs>
  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(32 42)">
      <rect width="268" height="236" rx="22" fill="#211b20" stroke="#4b3d39"/>
      <circle cx="34" cy="34" r="18" fill="#d8ad6a"/>
      <text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#241811">1</text>
      <text x="28" y="92" font-size="24" font-weight="700" fill="#fffaf4">Chat normally</text>
      <text x="28" y="136" font-size="16" fill="#d8ced2">“I take my coffee</text>
      <text x="28" y="166" font-size="16" fill="#d8ced2">without sugar and recently</text>
      <text x="28" y="196" font-size="16" fill="#d8ced2">started learning pour-over.”</text>
    </g>
    <path d="M310 160 H338" stroke="#c79a5a" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(348 42)">
      <rect width="268" height="236" rx="22" fill="#211b20" stroke="#4b3d39"/>
      <circle cx="34" cy="34" r="18" fill="#d8ad6a"/>
      <text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#241811">2</text>
      <text x="28" y="92" font-size="24" font-weight="700" fill="#fffaf4">Verify and save</text>
      <text x="28" y="136" font-size="16" fill="#d8ced2">Check the quote, subject,</text>
      <text x="28" y="166" font-size="16" fill="#d8ced2">negation, and sensitivity</text>
      <text x="28" y="196" font-size="16" fill="#d8ced2">before saving</text>
    </g>
    <path d="M626 160 H654" stroke="#c79a5a" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(664 42)">
      <rect width="268" height="236" rx="22" fill="#211b20" stroke="#4b3d39"/>
      <circle cx="34" cy="34" r="18" fill="#d8ad6a"/>
      <text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#241811">3</text>
      <text x="28" y="92" font-size="24" font-weight="700" fill="#fffaf4">Recall when relevant</text>
      <text x="28" y="136" font-size="16" fill="#d8ced2">When coffee comes up later,</text>
      <text x="28" y="166" font-size="16" fill="#d8ced2">supply the relevant memory</text>
      <text x="28" y="196" font-size="16" fill="#d8ced2">to the current model</text>
    </g>
    <path d="M942 160 H970" stroke="#c79a5a" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(980 42)">
      <rect width="268" height="236" rx="22" fill="#211b20" stroke="#4b3d39"/>
      <circle cx="34" cy="34" r="18" fill="#d8ad6a"/>
      <text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#241811">4</text>
      <text x="28" y="92" font-size="24" font-weight="700" fill="#fffaf4">Stay in control</text>
      <text x="28" y="136" font-size="16" fill="#d8ced2">Inspect its source and recall</text>
      <text x="28" y="166" font-size="16" fill="#d8ced2">reason; edit, archive, restore,</text>
      <text x="28" y="196" font-size="16" fill="#d8ced2">or delete</text>
    </g>
  </g>
</svg>
