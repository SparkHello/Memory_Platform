<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">接入 Memory Platform 前后的同一段对话</title>
  <desc id="desc">左边：普通聊天窗口里 AI 不记得用户偏好，反问喜欢什么口味。右边：接入 Memory Platform 后，新对话里 AI 自动带上「用户喜欢黑咖啡、不加糖」这条记忆直接给出推荐。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151217"/>
      <stop offset="1" stop-color="#241c1a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#c79a5a"/>
    </marker>
  </defs>
  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- 左：没有记忆 -->
    <g transform="translate(40 36)">
      <text x="0" y="0" font-size="15" fill="#a99da2">之前 · 每个新对话都从零开始</text>
      <rect y="18" width="540" height="350" rx="22" fill="#211b20" stroke="#4b3d39"/>
      <rect x="1" y="19" width="538" height="40" rx="21" fill="#2a2227"/>
      <circle cx="26" cy="39" r="5" fill="#5b4c49"/><circle cx="44" cy="39" r="5" fill="#5b4c49"/><circle cx="62" cy="39" r="5" fill="#5b4c49"/>
      <text x="270" y="44" text-anchor="middle" font-size="14" fill="#a99da2">你常用的聊天 App</text>

      <rect x="180" y="82" width="330" height="46" rx="16" fill="#3a2f2b"/>
      <text x="200" y="111" font-size="17" fill="#fffaf4">帮我推荐一款适合早上喝的咖啡</text>

      <rect x="30" y="148" width="420" height="70" rx="16" fill="#2b2326"/>
      <text x="50" y="178" font-size="17" fill="#d8ced2">好的！你平时喜欢什么口味？</text>
      <text x="50" y="204" font-size="17" fill="#d8ced2">偏酸、偏苦，加不加奶和糖？</text>

      <rect x="180" y="238" width="330" height="46" rx="16" fill="#3a2f2b"/>
      <text x="200" y="267" font-size="17" fill="#fffaf4">……我上次不是说过了吗</text>

      <text x="30" y="330" font-size="14" fill="#a99da2">AI 不记得你昨天、上周说过的任何事。</text>
    </g>

    <!-- 中间箭头 -->
    <g transform="translate(600 200)">
      <path d="M0 24 H60" stroke="#c79a5a" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="40" y="8" text-anchor="middle" font-size="13" fill="#e8bd78">只改一个地址</text>
    </g>

    <!-- 右：接入后 -->
    <g transform="translate(700 36)">
      <text x="0" y="0" font-size="15" fill="#e8bd78">之后 · 同一个 App，换了一个 Base URL</text>
      <rect y="18" width="540" height="350" rx="22" fill="#211b20" stroke="#8a6742" stroke-width="2"/>
      <rect x="1" y="19" width="538" height="40" rx="21" fill="#2a2227"/>
      <circle cx="26" cy="39" r="5" fill="#5b4c49"/><circle cx="44" cy="39" r="5" fill="#5b4c49"/><circle cx="62" cy="39" r="5" fill="#5b4c49"/>
      <text x="270" y="44" text-anchor="middle" font-size="14" fill="#a99da2">同一个聊天 App · 新对话</text>

      <rect x="180" y="82" width="330" height="46" rx="16" fill="#3a2f2b"/>
      <text x="200" y="111" font-size="17" fill="#fffaf4">帮我推荐一款适合早上喝的咖啡</text>

      <rect x="30" y="148" width="440" height="42" rx="12" fill="#1d2522" stroke="#39564a"/>
      <text x="48" y="175" font-size="14" fill="#8dd8b5">✓ 自动带上记忆：你喜欢黑咖啡，不加糖</text>

      <rect x="30" y="204" width="460" height="96" rx="16" fill="#2b2326"/>
      <text x="50" y="234" font-size="17" fill="#d8ced2">既然你一直喝不加糖的黑咖啡，早上</text>
      <text x="50" y="260" font-size="17" fill="#d8ced2">推荐一杯浅烘的埃塞俄比亚手冲：</text>
      <text x="50" y="286" font-size="17" fill="#d8ced2">酸度明亮、不苦，空腹也不刺激。</text>

      <text x="30" y="330" font-size="14" fill="#a99da2">记忆保存在你自己的设备上，随时可以查看、修改、删除。</text>
    </g>
  </g>
</svg>
