<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Memory Platform</title>
  <desc id="desc">A bilingual Memory Platform brand banner using a real screenshot of the local Web Console.</desc>
  <!-- The relative image keeps this source maintainable in the repository. The published JPEG is rendered deterministically, then console-studio.png is scaled to 648x405 and overlaid at x=576, y=74. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100d12"/>
      <stop offset="0.52" stop-color="#1b1519"/>
      <stop offset="1" stop-color="#2a201b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#d8ad6a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d8ad6a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
    <clipPath id="screen-clip">
      <rect x="576" y="74" width="648" height="405" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#background)"/>
  <rect width="1280" height="640" rx="28" fill="url(#glow)"/>

  <g opacity="0.46" fill="none" stroke="#d8ad6a" stroke-width="1.5">
    <path d="M68 92 C178 48 284 70 378 130"/>
    <path d="M76 548 C190 504 292 520 410 586"/>
    <circle cx="68" cy="92" r="5" fill="#d8ad6a"/>
    <circle cx="378" cy="130" r="5" fill="#d8ad6a"/>
    <circle cx="76" cy="548" r="5" fill="#d8ad6a"/>
    <circle cx="410" cy="586" r="5" fill="#d8ad6a"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="64" y="80" width="58" height="58" rx="18" fill="#d8ad6a"/>
    <text x="93" y="119" text-anchor="middle" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#231810">M</text>

    <text x="64" y="198" font-size="58" font-weight="760" letter-spacing="-1.5" fill="#fffaf4">Memory Platform</text>
    <text x="64" y="264" font-size="36" font-weight="650" fill="#f2e8dc">让 AI 跨对话记住你</text>
    <text x="64" y="306" font-size="23" font-weight="500" fill="#bdb2b8">Local-first memory for AI</text>

    <g font-size="16" font-weight="650" fill="#f4e9dc">
      <rect x="64" y="354" width="122" height="42" rx="21" fill="#342a29" stroke="#655044"/>
      <text x="125" y="381" text-anchor="middle">Local-first</text>
      <rect x="198" y="354" width="116" height="42" rx="21" fill="#342a29" stroke="#655044"/>
      <text x="256" y="381" text-anchor="middle">Auditable</text>
      <rect x="326" y="354" width="154" height="42" rx="21" fill="#342a29" stroke="#655044"/>
      <text x="403" y="381" text-anchor="middle">Model-neutral</text>
    </g>

    <text x="64" y="448" font-size="18" font-weight="550" fill="#d8ad6a">OpenAI-compatible · MCP · Web Console</text>
    <text x="64" y="486" font-size="17" fill="#a89ca3">Inspect · Edit · Delete · Back up</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="562" y="60" width="676" height="433" rx="26" fill="#171318" stroke="#786053" stroke-opacity="0.72"/>
    <image href="console-studio.png" x="576" y="74" width="648" height="405" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen-clip)"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="786" y="514" width="438" height="70" rx="22" fill="#201a1e" stroke="#5f4c44"/>
    <circle cx="824" cy="549" r="9" fill="#87d2a5"/>
    <text x="848" y="544" font-size="16" font-weight="650" fill="#f1e8df">Your memory stays inspectable</text>
    <text x="848" y="567" font-size="14" fill="#aa9fa5">Keep the context. Change the model.</text>
  </g>
</svg>
