name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t memory-platform:ci .

      - name: Start stack
        run: >-
          docker run -d --name memory-platform
          -p 127.0.0.1:2026:2026
          memory-platform:ci

      - name: Verify unprivileged runtime user
        run: >-
          docker exec memory-platform sh -c
          "grep -Eq '^Uid:[[:space:]]+10001' /proc/1/status"

      - name: Wait for Memory Gateway health
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:2026/health > /dev/null 2>&1; then
              echo "Memory Gateway is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Stack failed to become healthy; container logs:"
          docker logs memory-platform
          exit 1

      - name: Show first-run output
        if: always()
        run: docker logs memory-platform 2>&1 | head -40

  publish:
    name: Push to GHCR
    if: startsWith(github.ref, 'refs/tags/')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/memory-platform:latest
            ghcr.io/${{ env.OWNER_LC }}/memory-platform:${{ github.ref_name }}
