name: CI

on: [push, pull_request]

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install both services with dev extras
        run: >-
          python -m pip install
          -c constraints.txt
          -e 'services/memory-gateway[dev]'
          -e 'services/model-gateway[dev]'

      - name: Check Python dependency consistency
        run: python -m pip check

      - name: Check installer syntax
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/deploy/install.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          sh -n deploy/install.sh

      - name: Test Memory Gateway
        working-directory: services/memory-gateway
        run: python -m pytest -ra

      - name: Test Model Gateway
        working-directory: services/model-gateway
        run: python -m pytest -ra

  ui-build:
    name: UI tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/memory-gateway/ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/memory-gateway/ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Test UI onboarding behavior
        run: npm test

      - name: Build UI
        run: npm run build
