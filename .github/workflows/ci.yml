name: CI

on: [push, pull_request]

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install both services with dev extras
        run: >-
          python -m pip install
          -e 'services/memory-gateway[dev]'
          -e 'services/model-gateway[dev]'

      - name: Test Memory Gateway
        working-directory: services/memory-gateway
        run: python -m pytest -ra

      # TEMPORARY DIAGNOSTIC round 2. Round 1 showed the plain sequence PASSES
      # on Linux (status rc=0), so the symlink asymmetry is not the CI cause.
      # Remaining suspect: _state_process_matches needs the full home path inside
      # `ps -o command=` output, and pytest's tmp_path is ~40 chars longer than
      # round 1's path. procps ps truncates by width. Test that directly, and
      # run the failing test alone to separate pollution from environment.
      - name: Diagnose ps truncation and test isolation
        working-directory: services/model-gateway
        continue-on-error: true
        run: |
          python - <<'DIAG'
          import os, socket, subprocess, sys, tempfile
          from pathlib import Path
          from model_gateway import cli as c
          from model_gateway.config_store import gateway_paths

          def show(k, v): print(f"{k:34} {v}")

          # Recreate pytest's tmp_path shape and length exactly.
          base = Path("/tmp/pytest-of-runner/pytest-99/test_cli_background_start_stat0")
          base.mkdir(parents=True, exist_ok=True)
          home = base / "gateway-home"
          show("home", home)
          show("len(str(home))", len(str(home)))

          with socket.socket() as s:
              s.bind(("127.0.0.1", 0)); port = s.getsockname()[1]

          c.main(["--home", str(home), "init"])
          rc = c.main(["--home", str(home), "start", "--port", str(port)])
          show("start rc", rc)

          paths = gateway_paths(home)
          import json
          state = json.loads(paths.state.read_text()) if paths.state.exists() else {}
          pid = int(state.get("pid") or 0)

          print("\n=== ps truncation probe ===")
          for env_desc, env in (("inherited", None), ("COLUMNS=80", {**os.environ, "COLUMNS": "80"})):
              out = subprocess.run(["ps", "-p", str(pid), "-o", "command="],
                                   capture_output=True, text=True, env=env)
              val = out.stdout.strip()
              show(f"len ({env_desc})", len(val))
              show(f"home in it ({env_desc})", str(paths.home.resolve()) in val)
          wide = subprocess.run(["ps", "-ww", "-p", str(pid), "-o", "command="],
                                capture_output=True, text=True).stdout.strip()
          show("len (ps -ww)", len(wide))
          show("home in ps -ww", str(paths.home.resolve()) in wide)

          print("\n=== verdict with long path ===")
          cmd = c._process_command(pid) or ""
          show("_process_command len", len(cmd))
          show("expected_home in cmd", str(paths.home.resolve()) in cmd)
          show("_state_process_matches", c._state_process_matches(state, paths))
          show("_gateway_responding", c._gateway_responding(str(state.get("url") or "")))
          show("status rc (expect 0)", c.main(["--home", str(home), "status"]))
          c.main(["--home", str(home), "stop", "--timeout", "5", "--force"])
          DIAG

      - name: Run the failing test alone
        working-directory: services/model-gateway
        continue-on-error: true
        run: |
          python -m pytest -ra -vv \
            tests/test_cli.py::test_cli_background_start_status_and_stop
          echo "alone exit=$?"

      - name: Test Model Gateway
        working-directory: services/model-gateway
        run: python -m pytest -ra

  ui-build:
    name: UI production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/memory-gateway/ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/memory-gateway/ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Build UI
        run: npm run build
