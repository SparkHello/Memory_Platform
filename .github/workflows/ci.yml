name: CI

on: [push, pull_request]

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install both services with dev extras
        run: >-
          python -m pip install
          -e 'services/memory-gateway[dev]'
          -e 'services/model-gateway[dev]'

      - name: Test Memory Gateway
        working-directory: services/memory-gateway
        run: python -m pytest -ra

      # TEMPORARY DIAGNOSTIC. test_cli_background_start_status_and_stop fails on
      # Linux CI while passing locally on macOS: `start` reports the gateway
      # healthy, then `status` immediately returns 1. This reproduces that exact
      # sequence and dumps every input to _state_process_matches so the failing
      # condition is identified from the runner itself. Remove once diagnosed.
      - name: Diagnose background status mismatch
        working-directory: services/model-gateway
        continue-on-error: true
        run: |
          python - <<'DIAG'
          import json, os, socket, subprocess, sys, tempfile, time
          from pathlib import Path

          from model_gateway import cli as c
          from model_gateway.config_store import gateway_paths

          def show(label, value):
              print(f"{label:38} {value}")

          print("=== runner environment ===")
          show("platform", sys.platform)
          show("python", sys.version.split()[0])
          show("/tmp is symlink", Path("/tmp").is_symlink())
          show("/tmp resolves to", Path("/tmp").resolve())
          show("TMPDIR", os.environ.get("TMPDIR", "(unset)"))
          try:
              ps_version = subprocess.run(
                  ["ps", "--version"], capture_output=True, text=True, timeout=5
              ).stdout.strip()
          except Exception as exc:
              ps_version = f"unavailable: {exc!r}"
          show("ps implementation", ps_version)
          show("COLUMNS", os.environ.get("COLUMNS", "(unset)"))

          # Mirror the test: a tmp home plus a port discovered by bind-then-release.
          root = Path(tempfile.mkdtemp(prefix="diag-"))
          home = root / "gateway-home"
          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
              port = listener.getsockname()[1]

          print("\n=== init + start ===")
          show("home (raw)", home)
          show("home.resolve()", home.resolve())
          show("raw == resolved", str(home) == str(home.resolve()))
          show("init rc", c.main(["--home", str(home), "init"]))
          show("start rc", c.main(["--home", str(home), "start", "--port", str(port)]))

          paths = gateway_paths(home)
          state = {}
          if paths.state.exists():
              state = json.loads(paths.state.read_text(encoding="utf-8"))
          print("\n=== state file ===")
          show("exists", paths.state.exists())
          show("pid", state.get("pid"))
          show("state['home']", state.get("home"))
          show("expected_home", str(paths.home.resolve()))
          show("home fields equal", str(state.get("home") or "") == str(paths.home.resolve()))

          pid = int(state.get("pid") or 0)
          print("\n=== process identity ===")
          show("_pid_alive", c._pid_alive(pid) if pid else "no pid")
          for flag in ("stat=", "command="):
              try:
                  out = subprocess.run(
                      ["ps", "-p", str(pid), "-o", flag],
                      capture_output=True, text=True, timeout=5,
                  )
                  show(f"ps -o {flag} rc", out.returncode)
                  show(f"ps -o {flag} value", repr(out.stdout.strip()))
              except Exception as exc:
                  show(f"ps -o {flag}", f"error {exc!r}")

          command = c._process_command(pid) or ""
          print("\n=== the three command checks ===")
          show("_process_command len", len(command))
          show("command", repr(command))
          show("'model_gateway.cli' in cmd", "model_gateway.cli" in command)
          show("'serve' in cmd", "serve" in command)
          show("expected_home in cmd", str(paths.home.resolve()) in command)

          print("\n=== verdict ===")
          show("_state_process_matches", c._state_process_matches(state, paths) if state else "no state")
          url = str(state.get("url") or "")
          show("url", url)
          show("_gateway_responding", c._gateway_responding(url) if url else "no url")
          show("status rc (expect 0)", c.main(["--home", str(home), "status"]))

          # Re-check after a pause to separate a race from a hard mismatch.
          time.sleep(2)
          print("\n=== after 2s ===")
          show("_pid_alive", c._pid_alive(pid) if pid else "no pid")
          show("_gateway_responding", c._gateway_responding(url) if url else "no url")
          show("status rc", c.main(["--home", str(home), "status"]))

          c.main(["--home", str(home), "stop", "--timeout", "5", "--force"])
          DIAG

      - name: Test Model Gateway
        working-directory: services/model-gateway
        run: python -m pytest -ra

  ui-build:
    name: UI production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/memory-gateway/ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/memory-gateway/ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Build UI
        run: npm run build
