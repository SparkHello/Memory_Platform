# Development/self-build split stack.  The public release compose uses the
# same security topology with semver-pinned registry images.
services:
  stack-init:
    build:
      context: ..
      dockerfile: Dockerfile
      target: stack-init
    image: memory-platform-init:local
    network_mode: none
    environment:
      HOST_UID: "${HOST_UID:-}"
      HOST_GID: "${HOST_GID:-}"
      MEMGW_HOME: /memory-data/config
      MEMGW_SETTINGS_PATH: /memory-secrets/settings.env
      MODEL_GATEWAY_HOME: /model-data
      MODEL_GATEWAY_SECRETS_PATH: /model-secrets/secrets.env
    volumes:
      - memory-data:/memory-data
      - memory-secrets:/memory-secrets
      - model-data:/model-data
      - model-secrets:/model-secrets
      - type: bind
        source: "${MEMORY_CREDENTIAL_DIR:-./credentials}"
        target: /credentials
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  model-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      target: model-runtime
    image: memory-platform-model:local
    depends_on:
      stack-init:
        condition: service_completed_successfully
    user: "10002:10002"
    environment:
      MODEL_GATEWAY_HOME: /data
      MODEL_GATEWAY_SECRETS_PATH: /secrets/secrets.env
    # Model port 2030 is never published to the host; only Memory Gateway
    # reaches it over the internal `backend` network.
    volumes:
      - model-data:/data
      # The Model control plane atomically rotates provider/admin candidates in
      # this private volume.  It is writable only by UID 10002 and is never
      # mounted by Memory Gateway.
      - model-secrets:/secrets
    networks:
      - backend
      - provider-egress
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      # Local Model liveness only; operational acceptance is Memory /readyz.
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:2030/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  memory-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      target: memory-runtime
    image: memory-platform-memory:local
    depends_on:
      stack-init:
        condition: service_completed_successfully
      model-gateway:
        condition: service_healthy
    user: "10001:10001"
    environment:
      MEMGW_HOME: /data/config
      MEMGW_SETTINGS_PATH: /secrets/settings.env
      MEMGW_PROJECT_ROOT: /app/services/memory-gateway
    # Memory Gateway publishes the host port directly. `ingress` is its only
    # non-internal network; the Model wiring stays on the internal `backend`.
    ports:
      - "${MEMORY_HOST:-127.0.0.1}:${MEMORY_PORT:-2026}:2026"
    volumes:
      - memory-data:/data
      - memory-secrets:/secrets:ro
    networks:
      - backend
      - ingress
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      # Liveness keeps the setup UI reachable before providers are configured.
      # Operational acceptance separately checks the unauthenticated, safe-code
      # /readyz endpoint; fresh installs may be live while setup is incomplete.
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:2026/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

networks:
  backend:
    internal: true
  ingress: {}
  provider-egress: {}

volumes:
  memory-data: {}
  memory-secrets: {}
  model-data: {}
  model-secrets: {}
