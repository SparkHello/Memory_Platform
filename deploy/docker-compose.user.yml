# 用户版：直接拉取预构建镜像，不需要 clone 仓库、不需要 Python/Node。
# 最简单的用法是一键脚本（自动下载本文件、避开占用端口并打印密钥）：
#   curl -fsSL https://raw.githubusercontent.com/SparkHello/Memory_Platform/main/deploy/install.sh | sh
# 手工用法：
#   curl -O https://raw.githubusercontent.com/SparkHello/Memory_Platform/main/deploy/docker-compose.user.yml
#   docker compose -f docker-compose.user.yml up -d
# 首次启动需 1–2 分钟完成内部安装，之后容器日志会各打印一次
# GATEWAY_API_KEY 和 admin key：
#   docker compose -f docker-compose.user.yml logs memory-platform
# 端口 2026 被占用时，在本文件同目录的 .env 写入一行 MEMORY_PORT=3026 后重启，
# 之后所有文档中的 2026 换成 3026。
# 想在手机/其他设备上访问时，在 .env 加一行 MEMORY_HOST=0.0.0.0 后重启，
# 然后改用电脑的局域网 IP（仅限可信家庭网络，不要把服务无鉴权暴露到公网）。
# 想自己指定密钥（至少 16 个字符）而不是用自动生成的，在首次启动前这样跑：
#   GATEWAY_API_KEY=你的密钥 docker compose -f docker-compose.user.yml up -d
# 建议不要写进 .env，以免密钥明文留在安装目录里。
services:
  memory-platform:
    image: ghcr.io/sparkhello/memory-platform:latest
    ports:
      # 默认只绑回环；手机/局域网访问在同目录 .env 加 MEMORY_HOST=0.0.0.0
      - "${MEMORY_HOST:-127.0.0.1}:${MEMORY_PORT:-2026}:2026"
    environment:
      # 自定义密钥（可选，至少 16 个字符），只在首次启动生成密钥时生效；
      # 留空则容器自动生成一枚高强度密钥。之后更换请用 memgw / modelgw secret set。
      GATEWAY_API_KEY: "${GATEWAY_API_KEY:-}"
      MEMORY_CONSOLE_ADMIN_KEY: "${MEMORY_CONSOLE_ADMIN_KEY:-}"
      # 容器内固定监听 2026，宿主机映射到哪个端口只有这里知道。告诉容器一声，
      # 它打印的接入地址才是用户真正能访问的那个。
      MEMORY_PUBLIC_PORT: "${MEMORY_PORT:-2026}"
    volumes:
      - memory-platform-data:/data
    restart: unless-stopped
    healthcheck:
      # 首次启动的接线安装约 1 分钟，start_period 给足余量
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:2026/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  memory-platform-data:
