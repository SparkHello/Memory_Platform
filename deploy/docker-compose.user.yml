# Memory Platform split-container release stack.
#
# Recommended: use deploy/install.sh.  It creates ./credentials with mode 0700,
# resolves these semver images to immutable digests, initializes the four
# private volumes offline, and reports only credential *file paths*.
# No API key is accepted through Compose environment variables or daemon logs.
services:
  stack-init:
    image: "${MEMORY_PLATFORM_INIT_IMAGE:-ghcr.io/sparkhello/memory-platform-init:v0.2.0}"
    pull_policy: missing
    network_mode: none
    environment:
      HOST_UID: "${HOST_UID:-}"
      HOST_GID: "${HOST_GID:-}"
      MEMGW_HOME: /memory-data/config
      MEMGW_SETTINGS_PATH: /memory-secrets/settings.env
      MODEL_GATEWAY_HOME: /model-data
      MODEL_GATEWAY_SECRETS_PATH: /model-secrets/secrets.env
    volumes:
      - memory-data:/memory-data
      - memory-secrets:/memory-secrets
      - model-data:/model-data
      - model-secrets:/model-secrets
      - type: bind
        source: "${MEMORY_CREDENTIAL_DIR:-./credentials}"
        target: /credentials
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  model-gateway:
    image: "${MEMORY_PLATFORM_MODEL_IMAGE:-ghcr.io/sparkhello/memory-platform-model:v0.2.0}"
    pull_policy: missing
    depends_on:
      stack-init:
        condition: service_completed_successfully
    user: "10002:10002"
    environment:
      MODEL_GATEWAY_HOME: /data
      MODEL_GATEWAY_SECRETS_PATH: /secrets/secrets.env
    # Only this container has a non-internal network. A fixed raw TCP relay
    # forwards the public Memory port over `backend`; Model port 2030 remains
    # private and the relay never parses or logs HTTP bytes.
    ports:
      - "${MEMORY_HOST:-127.0.0.1}:${MEMORY_PORT:-2026}:2026"
    volumes:
      - model-data:/data
      # The Model control plane atomically rotates provider/admin candidates in
      # this private volume.  It is writable only by UID 10002 and is never
      # mounted by Memory Gateway.
      - model-secrets:/secrets
    networks:
      - backend
      - provider-egress
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      # Verify both the fixed ingress listener and Model liveness. The relay
      # target starts after this service becomes healthy, so this only probes
      # its local listener; cross-service acceptance uses Memory /readyz.
      test: ["CMD", "python", "-c", "import socket,sys,urllib.request; s=socket.create_connection(('127.0.0.1',2026),timeout=3); s.close(); sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:2030/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  memory-gateway:
    image: "${MEMORY_PLATFORM_MEMORY_IMAGE:-ghcr.io/sparkhello/memory-platform-memory:v0.2.0}"
    pull_policy: missing
    depends_on:
      stack-init:
        condition: service_completed_successfully
      model-gateway:
        condition: service_healthy
    user: "10001:10001"
    environment:
      MEMGW_HOME: /data/config
      MEMGW_SETTINGS_PATH: /secrets/settings.env
      MEMGW_PROJECT_ROOT: /app/services/memory-gateway
    volumes:
      - memory-data:/data
      - memory-secrets:/secrets:ro
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      # Keep the setup UI reachable before a first provider is configured.
      # Upgrade/final acceptance separately requires authenticated /readyz.
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:2026/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Run only through an explicit `--profile maintenance ... run` command.
  # Provider/admin secrets are intentionally absent and networking is disabled.
  stack-maintenance:
    profiles: [maintenance]
    image: "${MEMORY_PLATFORM_INIT_IMAGE:-ghcr.io/sparkhello/memory-platform-init:v0.2.0}"
    pull_policy: missing
    entrypoint: ["memgw"]
    user: "0:0"
    network_mode: none
    environment:
      MEMGW_HOME: /data/config
      MEMGW_SETTINGS_PATH: /secrets/settings.env
      MEMGW_PROJECT_ROOT: /app/services/memory-gateway
      MODEL_GATEWAY_HOME: /model-data
    volumes:
      - memory-data:/data
      - memory-secrets:/secrets
      - model-data:/model-data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    restart: "no"

networks:
  backend:
    internal: true
  provider-egress: {}

volumes:
  memory-data: {}
  memory-secrets: {}
  model-data: {}
  model-secrets: {}
